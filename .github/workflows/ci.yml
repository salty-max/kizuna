name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · typecheck · knip · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format (Prettier)
        run: bun run format:check

      - name: Lint (ESLint)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unused exports (Knip)
        run: bun run knip

      - name: Unit tests
        run: bun test

      - name: Build and verify production artifact
        run: bun run build:vercel
        env:
          VERCEL_PROJECT_PRODUCTION_URL: kizuna-green.vercel.app

      - name: Production performance budget
        run: bun run perf:budget

  e2e:
    name: Playwright · Chromium
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
